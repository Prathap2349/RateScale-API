name: RateScale SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ratescale_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js v20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.10'

      - name: Install Python AI Dependencies & Verify FastAPI Service
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ratescale_db
        run: |
          cd ai_service
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          python create_tables.py
